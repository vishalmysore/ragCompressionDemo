name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: headroom-demo/package-lock.json

      - name: Install dependencies
        working-directory: headroom-demo
        run: npm ci

      - name: Build
        working-directory: headroom-demo
        run: npm run build
        env:
          GITHUB_ACTIONS: true   # triggers base: '/ragCompressionDemo/' in vite.config

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: headroom-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
